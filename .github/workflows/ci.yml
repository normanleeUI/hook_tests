name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        # Point the harness at the vendored hook scripts in this repo.
        # Without this it defaults to ~/.claude/hooks (absent in CI), and every
        # hook test would silently skip -- a green-but-meaningless run.
        env:
          HOOKS_DIR: ${{ github.workspace }}/hooks
        run: uv run pytest tests/test_hooks/ -v
