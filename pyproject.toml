[project]
name = "hook-test-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "hypothesis==6.122.3",
    "mutmut>=3.2,<4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.8.0",
    "bandit>=1.9,<2",
    "pyright>=1.1,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -n6 -m 'not network and not hypothesis'"
markers = [
    "network: tests that make real network calls (e.g. pip-audit hitting PyPI)",
    "hypothesis: property-based tests using Hypothesis (slow; deselected by default)",
    "slow: marks tests as slow",
]

[tool.ruff]
# src/has_suppressions.py is an intentional fixture with bad code for testing
# suppression detection; it must not be linted.
exclude = ["src/has_suppressions.py"]

[dependency-groups]
dev = []
